<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - ZPDA</title>
<link rel="stylesheet" href="style.css">
<style>
/* --- Body & Nav --- */
body {
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  min-height: 100vh;
  margin: 0;
}

/* Navigation */
nav {
  background:#0f3460;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  max-width:400px;
  border-radius:8px 8px 0 0;
  margin-bottom:20px;
}

nav a {
  color:white;
  text-decoration:none;
  margin-left:15px;
  font-weight:500;
}

nav a.active {
  color:#e43f5a;
  font-weight:bold;
}

/* --- Login Container --- */
.login-container {
  background: #162447;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.login-container h2 {
  margin-bottom: 25px;
  color: #e43f5a;
  font-weight:600;
  font-size:1.8em;
}

/* Inputs */
.login-container input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #e43f5a;
  background: #1f4068;
  color: white;
  font-size: 1em;
}

.login-container input::placeholder {
  color: #ccc;
}

/* Button */
.login-container button {
  width: 100%;
  padding: 12px;
  background: #e43f5a;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 1em;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.3s;
}

.login-container button:hover {
  background: #d73750;
}

/* Footer links */
.login-footer {
  margin-top: 20px;
  font-size: 0.9em;
  color: #ccc;
}

.login-footer a {
  color: #38bdf8;
  text-decoration: none;
  font-weight:500;
}

.login-footer a:hover {
  text-decoration: underline;
}

/* --- Responsive --- */
@media(max-width:450px){
  .login-container, nav {
    width:90%;
    padding:20px;
  }
}

/* ===== MOBILE FIX ONLY ===== */
@media (max-width: 768px) {

  .main-header {
    flex-direction: column;
    align-items: flex-start;
    padding: 10px 15px;
  }

  .nav-bar {
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }

  .nav-bar a {
    font-size: 0.9em;
  }

  .hero-about {
    padding: 60px 15px;
  }

  .hero-about h1 {
    font-size: 26px;
  }

  .hero-about p {
    font-size: 15px;
  }

  .container {
    margin: 20px auto;
  }

}
</style>
</head>
<body>

<!-- Navigation -->
<nav>
  <a href="index.html">Home</a>
  <div>
    <a href="login.html" class="active">Login</a>
    <a href="signup.html">Sign Up</a>
  </div>
</nav>

<!-- Login Form -->
<div class="login-container">
  <h2>Login to ZPDA</h2>
  <input type="text" id="username" placeholder="Username or Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>

  <div class="login-footer">
    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>

    <!-- ADDED ONLY THIS LINE -->
    <p><a href="login.html">Forgot Password?</a></p>
  </div>
</div>

<script>
document.getElementById("loginBtn").addEventListener("click", async () => {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!username || !password){
    return alert("Please enter both username/email and password.");
  }

  try {
    const payload = username.includes("@") 
      ? { email: username, password } 
      : { name: username, password };

    const res = await fetch("https://zpda-backend-1.onrender.com/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if(data.error){
      return alert(data.error);
    }

    localStorage.setItem("user", JSON.stringify(data.user));
    localStorage.setItem("zpdaToken", data.token);

    window.location.href = "dashboard.html";

  } catch(err){
    console.error(err);
    alert("Login failed. Please try again.");
  }
});
</script>

</body>
</html>

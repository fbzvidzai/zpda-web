<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - ZPDA</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  background: #162447;
  padding: 30px;
  border-radius: 12px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  text-align: center;
}

h2 {
  color: #e43f5a;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #e43f5a;
  background: #1f4068;
  color: white;
  font-size: 1em;
}

button {
  width: 100%;
  padding: 12px;
  background: #e43f5a;
  border: none;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #d73750;
}

small {
  color: #ccc;
}

.msg {
  margin-top: 10px;
  font-size: 0.9em;
}

/* ===== MOBILE FIX ONLY ===== */
@media (max-width: 768px) {

  .main-header {
    flex-direction: column;
    align-items: flex-start;
    padding: 10px 15px;
  }

  .nav-bar {
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }

  .nav-bar a {
    font-size: 0.9em;
  }

  .hero-about {
    padding: 60px 15px;
  }

  .hero-about h1 {
    font-size: 26px;
  }

  .hero-about p {
    font-size: 15px;
  }

  .container {
    margin: 20px auto;
  }

}
</style>
</head>

<body>

<div class="container">
  <h2>Forgot Password</h2>

  <input type="email" id="email" placeholder="Enter your email">

  <button onclick="sendReset()">Send Reset Link</button>

  <p class="msg" id="msg"></p>

  <p><small>We will send a new password to your email</small></p>
</div>

<script>
async function sendReset() {
  const email = document.getElementById("email").value.trim();
  const msg = document.getElementById("msg");

  if (!email) {
    msg.style.color = "orange";
    msg.innerText = "Please enter your email";
    return;
  }

  msg.style.color = "yellow";
  msg.innerText = "Sending reset link...";

  try {
    const res = await fetch("https://zpda-backend-1.onrender.com/forgot-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.style.color = "red";
      msg.innerText = data.error || "Failed";
      return;
    }

    msg.style.color = "lightgreen";
    msg.innerText = data.message;

  } catch (err) {
    console.error(err);
    msg.style.color = "red";
    msg.innerText = "Server not responding";
  }
}
</script>

</body>
</html>

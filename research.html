<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZPDA Research Papers</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Segoe UI,sans-serif;
background:#0f172a;
color:white;
}

.main-header{
position:sticky;
top:0;
background:#0f3460;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
}

.logo{
font-size:1.3rem;
font-weight:bold;
}

.nav-bar{
display:flex;
gap:18px;
flex-wrap:wrap;
}

.nav-bar a{
text-decoration:none;
color:white;
font-size:0.95rem;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

h2{
text-align:center;
margin-bottom:20px;
}

.filter{
display:flex;
justify-content:center;
margin-bottom:25px;
}

.filter input{
width:100%;
max-width:400px;
padding:12px;
border:none;
border-radius:8px;
background:#1e293b;
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.3);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
color:#facc15;
margin-top:0;
}

.card p{
font-size:14px;
}

.abstract{
background:#111827;
padding:10px;
border-radius:8px;
margin:10px 0;
max-height:80px;
overflow:hidden;
transition:.3s;
}

.abstract.expanded{
max-height:1000px;
}

.read-more{
cursor:pointer;
color:#38bdf8;
font-size:13px;
font-weight:bold;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

.btn{
padding:8px 12px;
border-radius:6px;
text-decoration:none;
border:none;
cursor:pointer;
font-weight:bold;
}

.download{
background:#38bdf8;
color:black;
}

.icon-btn{
background:none;
border:none;
color:white;
font-size:18px;
cursor:pointer;
}

.loading{
text-align:center;
padding:30px;
}

footer{
text-align:center;
padding:20px;
color:#94a3b8;
}

@media(max-width:768px){

.grid{
grid-template-columns:1fr;
}

.actions{
flex-direction:column;
}

.download{
width:100%;
text-align:center;
}

}

</style>
</head>

<body>

<header class="main-header">

<div class="logo">
Zimbabwean Poetry Digital Archive
</div>

<nav class="nav-bar">
<a href="index.html">Home</a>
<a href="archive.html">Archive</a>
<a href="explore.html">Explore</a>
<a href="research.html">Research</a>
<a href="submit.html">Submit</a>
<a href="about.html">About</a>
</nav>

</header>

<div class="container">

<h2>Research Papers</h2>

<div class="filter">
<input
type="text"
id="searchInput"
placeholder="Search by title, author or keyword..."
>
</div>

<div id="researchGrid" class="grid">
<div class="loading">
Loading research papers...
</div>
</div>

</div>

<footer>
The Zimbabwean Poetry Digital Archive is an open-access Digital Humanities platform supporting the preservation and study of Zimbabwean poetry.
</footer>

<script>

const grid=document.getElementById("researchGrid");

let allPapers=[];

async function fetchResearch(){

try{

const response=await fetch(
"https://zpda-backend-1.onrender.com/research-papers"
);

if(!response.ok){
throw new Error("Server error");
}

const papers=await response.json();

allPapers=papers.map(p=>{

return{

title:p.title || "Untitled",

authors:p.authors || "Unknown",

year:p.year || "N/A",

abstract:p.abstract || "No abstract available",

keywords:p.keywords || [],

fileUrl:
p.fileUrl?.startsWith("http")
? p.fileUrl
: `https://zpda-backend-1.onrender.com/${p.fileUrl}`

};

});

renderPapers(allPapers);

}catch(error){

console.log(error);

grid.innerHTML=`
<div style="text-align:center;color:#f87171;">
Failed to load research papers
</div>
`;

}

}

function renderPapers(papers){

grid.innerHTML="";

if(papers.length===0){

grid.innerHTML=`
<div style="text-align:center;">
No papers found
</div>
`;

return;

}

papers.forEach(p=>{

const card=document.createElement("div");

card.className="card";

const shareText=`
${p.title}

Author: ${p.authors}

Read:
${p.fileUrl}
`;

card.innerHTML=`

<h3>${p.title}</h3>

<p>
<strong>Authors:</strong>
${p.authors}
</p>

<p>
<strong>Year:</strong>
${p.year}
</p>

<div class="abstract">
${p.abstract}
</div>

<div class="read-more">
Read more
</div>

<p>
<strong>Keywords:</strong>
${p.keywords.join(", ")}
</p>

<div class="actions">

<a
href="${p.fileUrl}"
target="_blank"
class="btn download"
>
View PDF
</a>

<button class="icon-btn share">
<i class="fa-solid fa-share"></i>
</button>

</div>

`;

const abstract=card.querySelector(".abstract");

const btn=card.querySelector(".read-more");

btn.onclick=()=>{

abstract.classList.toggle("expanded");

btn.innerText=
abstract.classList.contains("expanded")
?
"Read less"
:
"Read more";

};

card.querySelector(".share").onclick=()=>{

if(navigator.share){

navigator.share({

title:p.title,
text:shareText

});

}else{

navigator.clipboard.writeText(
shareText
);

alert("Copied");

}

};

grid.appendChild(card);

});

}

document
.getElementById("searchInput")
.addEventListener("input",e=>{

const term=e.target.value.toLowerCase();

const filtered=allPapers.filter(p=>

p.title.toLowerCase().includes(term) ||

p.authors.toLowerCase().includes(term) ||

p.keywords.join(" ")
.toLowerCase()
.includes(term)

);

renderPapers(filtered);

});

fetchResearch();

</script>

</body>
</html>

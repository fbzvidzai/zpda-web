<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - ZPDA</title>
<link rel="stylesheet" href="style.css">
<style>
/* --- Body & Nav --- */
body {
  font-family: 'Segoe UI', sans-serif;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  min-height:100vh;
  margin:0;
  color:white;
}

nav {
  background:#0f3460;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  max-width:400px;
  border-radius:8px 8px 0 0;
  margin-bottom:20px;
}

nav a {
  color:white;
  text-decoration:none;
  margin-left:15px;
  font-weight:500;
}

nav a.active {
  color:#e43f5a;
  font-weight:bold;
}

/* --- Sign Up Container --- */
.signup-container {
  background:#162447;
  padding:40px 30px;
  border-radius:12px;
  width:100%;
  max-width:400px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,0.5);
}

.signup-container h2 {
  margin-bottom:25px;
  color:#e43f5a;
  font-weight:600;
  font-size:1.8em;
}

/* --- Inputs --- */
input {
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #e43f5a;
  background:#1f4068;
  color:#fff;
  font-size:14px;
}

input::placeholder {
  color:#ccc;
}

/* --- Button --- */
button {
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  background:#e43f5a;
  color:#fff;
  font-size:16px;
  font-weight:600;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

button:hover {
  background:#d73750;
}

/* --- Login Link --- */
.login-link {
  text-align:center;
  margin-top:20px;
  font-size:14px;
  color:#ccc;
}

.login-link a {
  color:#e43f5a;
  font-weight:500;
  text-decoration:none;
}

.login-link a:hover {
  text-decoration:underline;
}

/* --- Responsive --- */
@media(max-width:450px){
  .signup-container, nav {
    width:90%;
    padding:20px;
  }
}

/* ===== MOBILE FIX ONLY ===== */
@media (max-width: 768px) {

  .main-header {
    flex-direction: column;
    align-items: flex-start;
    padding: 10px 15px;
  }

  .nav-bar {
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }

  .nav-bar a {
    font-size: 0.9em;
  }

  .hero-about {
    padding: 60px 15px;
  }

  .hero-about h1 {
    font-size: 26px;
  }

  .hero-about p {
    font-size: 15px;
  }

  .container {
    margin: 20px auto;
  }

}
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <div>
    <a href="signup.html" class="active">Sign Up</a>
    <a href="login.html">Login</a>
  </div>
</nav>

<div class="signup-container">
  <h2>Create Your Account</h2>
  <input type="text" id="username" placeholder="Username" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password (Choose memorable password)" required>
  <button onclick="signup()">Sign Up</button>
  <div class="login-link">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script>
async function signup() {
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!username || !email || !password){
    alert("Please fill all fields");
    return;
  }

  try {
    const res = await fetch("https://zpda-backend-1.onrender.com/signup", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ username, email, password }) // match backend fields
    });

    const data = await res.json();

    if(res.ok && data.user && data.token){
      const user = { _id: data.user._id, username: data.user.username, email: data.user.email };
      localStorage.setItem("user", JSON.stringify(user));
      localStorage.setItem("zpdaToken", data.token);
      window.location.href = "dashboard.html";
    } else {
      alert(data.message || data.error || "Signup failed");
    }

  } catch(err){
    console.error("Signup error:", err);
    alert("Error connecting to server. Please try again later.");
  }
}
</script>

</body>
</html>
